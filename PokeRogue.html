<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <title>PokéRogue</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #484050;
      font-family: Arial, Helvetica, sans-serif;
    }
    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    #bar {
      position: fixed;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 6px;
      opacity: 0.35;
      transition: opacity 0.2s;
      z-index: 2;
    }
    #bar:hover, #bar:focus-within { opacity: 1; }
    #bar button, #bar a {
      font: 12px Arial, Helvetica, sans-serif;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      text-decoration: none;
    }
    #help {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      background: #484050;
      padding: 20px;
      z-index: 1;
    }
    #help a {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 18px;
      background: #da3838;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<iframe
  id="game"
  src="https://pokerogue.net/"
  title="PokéRogue"
  allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
  allowfullscreen>
</iframe>

<div id="help">
  <div>
    PokéRogue didn't load inside this page.<br/>
    The site may block being embedded, or a network filter may be blocking pokerogue.net.<br/>
    <a href="https://pokerogue.net/" target="_blank" rel="noopener">Open PokéRogue</a>
  </div>
</div>

<div id="bar">
  <button id="fs" type="button">Fullscreen</button>
  <button id="reload" type="button">Reload</button>
  <a href="https://pokerogue.net/" target="_blank" rel="noopener">Open in tab</a>
</div>

<script>
  var frame = document.getElementById("game");
  var loaded = false;

  frame.addEventListener("load", function () { loaded = true; });

  // If the frame never finishes loading, offer to open the site directly
  setTimeout(function () {
    if (!loaded) {
      document.getElementById("help").style.display = "flex";
    }
  }, 15000);

  document.getElementById("fs").addEventListener("click", function () {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      req.call(el);
    }
  });

  document.getElementById("reload").addEventListener("click", function () {
    frame.src = frame.src;
  });

  // Keep keyboard input going to the game
  window.addEventListener("focus", function () { frame.focus(); });
</script>

</body>
</html>
