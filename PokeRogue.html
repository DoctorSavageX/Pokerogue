<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="theme-color" content="#da3838"/>
  <title>PokéRogue</title>
  <style>
    html, body { background: #484050; margin: 0; }
    #touchControls:not(.visible) { display: none; }
    #launcher {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: #fff;
      font: 16px Arial, Helvetica, sans-serif;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="launcher">Checking for updates…</div>

<script>
  // Downloads the newest PokeRogue build (rebuilt daily by .github/workflows/build.yml)
  // and keeps a copy so the game still starts if the update check fails.
  var BUILD_URL = "https://raw.githubusercontent.com/DoctorSavageX/Pokerogue/HEAD/latest/";
  var launcher = document.getElementById("launcher");

  function status(text) {
    launcher.textContent = text;
  }

  function openDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open("pokerogue-launcher", 1);
      req.onupgradeneeded = function () { req.result.createObjectStore("build"); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function readCache() {
    return openDb().then(function (db) {
      return new Promise(function (resolve) {
        var req = db.transaction("build").objectStore("build").get("current");
        req.onsuccess = function () { resolve(req.result || null); };
        req.onerror = function () { resolve(null); };
      });
    }).catch(function () { return null; });
  }

  function writeCache(build) {
    return openDb().then(function (db) {
      db.transaction("build", "readwrite").objectStore("build").put(build, "current");
    }).catch(function () {});
  }

  function fetchText(name, version) {
    return fetch(BUILD_URL + name + "?v=" + version, { cache: "no-store" }).then(function (r) {
      if (!r.ok) {
        throw new Error(name + ": HTTP " + r.status);
      }
      return r.text();
    });
  }

  function start(build) {
    console.log("PokéRogue " + build.info.version + " (" + build.info.pokerogueCommit + ", built " + build.info.builtAt + ")");

    // Relative game asset paths resolve against the pokerogue-assets repo
    var base = document.createElement("base");
    base.href = build.info.assetsBase;
    document.head.insertBefore(base, document.head.firstChild);

    var style = document.createElement("style");
    style.textContent = build.css;
    document.head.appendChild(style);

    launcher.remove();
    document.body.insertAdjacentHTML("afterbegin", build.shell);

    var script = document.createElement("script");
    script.type = "module";
    script.textContent = build.js;
    document.body.appendChild(script);
  }

  readCache().then(function (cached) {
    return fetch(BUILD_URL + "version.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) {
          throw new Error("version.json: HTTP " + r.status);
        }
        return r.json();
      })
      .then(function (info) {
        if (cached && cached.info.pokerogueCommit === info.pokerogueCommit && cached.info.builtAt === info.builtAt) {
          return cached;
        }
        status("Downloading PokéRogue " + info.version + "…");
        var v = encodeURIComponent(info.builtAt);
        return Promise.all([fetchText("game.js", v), fetchText("game.css", v), fetchText("shell.html", v)]).then(function (parts) {
          var build = { info: info, js: parts[0], css: parts[1], shell: parts[2] };
          writeCache(build);
          return build;
        });
      })
      .catch(function (err) {
        console.warn("Update check failed:", err);
        if (cached) {
          return cached;
        }
        throw err;
      });
  }).then(start, function (err) {
    status("Couldn't download PokéRogue (" + err.message + "). Check your internet connection, or whether raw.githubusercontent.com is blocked.");
  });
</script>

</body>
</html>
